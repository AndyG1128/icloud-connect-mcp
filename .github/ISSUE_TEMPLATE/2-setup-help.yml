name: Setup help
description: Ask about installation, configuration, discovery or client connection.
title: "[Setup]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the [README](https://github.com/AndyG1128/icloud-connect-mcp/blob/main/README.md)
        and [troubleshooting guide](https://github.com/AndyG1128/icloud-connect-mcp/blob/main/docs/troubleshooting.md).
        This issue is public. Do not paste credentials, account addresses, tunnel IDs,
        configuration files, ledgers, resource references or private message/event data.
        Describe settings with placeholders and quote only short redacted errors.
        Suspected vulnerabilities belong in
        [private reporting](https://github.com/AndyG1128/icloud-connect-mcp/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Connector version and source commit
      placeholder: "0.2.0b1, public commit SHA; or not yet installed"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and client
      description: OS, Python version, client/version and local stdio or tunnel connection. Omit private paths and host/account identifiers.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where are you stuck?
      options:
        - Installation or build
        - Account-free ping or discovery
        - Account configuration or login
        - Access profile or resource restrictions
        - Secure MCP Tunnel or ChatGPT connection
        - Disconnect, restart or reconnect
        - Other setup question
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question and steps tried
      description: Link the public instructions you followed and describe the result. Include only sanitized commands and short redacted errors.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked the public instructions and existing issues and removed secrets and private data.
          required: true
        - label: This is not a sensitive vulnerability report; I will use private reporting for those.
          required: true
