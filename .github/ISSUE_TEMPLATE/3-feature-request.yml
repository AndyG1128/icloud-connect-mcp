name: Feature request
description: Suggest a capability or documentation improvement for the beta.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the [documented limitations](https://github.com/AndyG1128/icloud-connect-mcp/blob/main/README.md)
        and existing issues first. Describe your use case with synthetic examples.
        This issue is public: omit credentials, account identifiers and private data.
        Filing a request does not authorize account access or live mutations.
        Suspected vulnerabilities belong in
        [private reporting](https://github.com/AndyG1128/icloud-connect-mcp/security/advisories/new).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What task is difficult with the current connector?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the expected behavior and whether this is a tool, setup or documentation change.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Access and safety considerations
      description: Would this require new reads, writes, credentials, storage or broader resource access? State unknowns rather than assuming approval.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or simpler approaches.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing requests and removed secrets and private data from this proposal.
          required: true
        - label: This is not a sensitive vulnerability report; I will use private reporting for those.
          required: true
